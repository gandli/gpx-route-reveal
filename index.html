<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn a GPX track into a 3D satellite route-reveal animation. 100% in-browser, no upload." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
  <title>GPX Route Reveal</title>
</head>
<body class="h-full font-sans">
  <div id="app" class="relative h-full w-full">
    <div id="map" class="absolute inset-0 h-full w-full"></div>
    <details id="panel" open class="group absolute top-4 left-4 z-10 w-80 max-w-[calc(100vw-2rem)] rounded-[14px] border border-black/8 bg-white/92 p-4 pb-3 shadow-[0_8px_30px_rgba(0,0,0,0.15)] backdrop-blur-md open:pb-4">
      <summary class="flex cursor-pointer list-none items-center gap-2 text-lg font-bold text-gray-800 select-none after:ml-auto after:text-gray-500 after:content-['▾'] after:transition-transform group-open:after:-rotate-90">GPX Route Reveal</summary>
      <section class="mt-3">
        <h2 class="mb-1.5 text-[11px] font-bold tracking-[0.06em] text-gray-500 uppercase">Route</h2>
        <select id="preset" title="Load a preset route" class="mb-2 w-full rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[13px] text-gray-800">
          <option value="">Preset routes…</option>
          <option value="moxi">Moxi Trail (demo.gpx)</option>
          <option value="yongquan-baiyun">Yongquan Temple → Baiyun Cave (Gushan)</option>
          <option value="fudao-jinniushan">Fudao Skyline Walk → Jinniushan</option>
          <option value="fudao-full">Fudao Full Trail (11.6km, 7 waypoints)</option>
          <option value="sanfang-yantai">Three Lanes &amp; Seven Alleys → Yantai Hill</option>
          <option value="wushan-yushan">Wushan → Yushan (two pagodas)</option>
          <option value="shangxiahang-yantai">Shangxiahang → Yantai Hill</option>
        </select>
        <div id="drop" class="cursor-pointer rounded-[10px] border-2 border-dashed border-slate-300 p-[18px] text-center text-sm text-gray-500 transition-colors hover:border-accent">Drop .gpx here</div>
        <input id="file" type="file" accept=".gpx" hidden />
        <button id="pick" title="Click the origin, then the destination, on the map" class="mt-2 w-full cursor-pointer rounded-lg border border-slate-300 bg-transparent px-3 py-[9px] text-sm font-semibold text-gray-800 hover:border-accent hover:text-accent">Pick origin &amp; destination</button>
        <div id="meta" hidden class="mt-2.5 text-xs text-gray-500"></div>
      </section>
      <section id="controls" class="mt-3 grid gap-2">
        <h2 class="text-[11px] font-bold tracking-[0.06em] text-gray-500 uppercase">Playback</h2>
        <div class="row flex gap-2">
          <button id="play" title="Play" class="flex-1 cursor-pointer rounded-lg border-none bg-accent px-1.5 py-[9px] text-[13px] font-semibold text-white disabled:cursor-wait disabled:opacity-50">▶ Play</button>
          <button id="pause" title="Pause" class="flex-1 cursor-pointer rounded-lg border-none bg-accent px-1.5 py-[9px] text-[13px] font-semibold text-white disabled:cursor-wait disabled:opacity-50">⏸ Pause</button>
          <button id="loop" class="flex-1 cursor-pointer rounded-lg border border-slate-300 bg-transparent px-1.5 py-[9px] text-[13px] font-semibold text-gray-800 hover:border-accent hover:text-accent aria-[pressed=true]:border-accent aria-[pressed=true]:bg-accent aria-[pressed=true]:text-white" title="Loop playback" aria-pressed="false">↻ Loop</button>
          <button id="export" title="Record animation to WebM" class="flex-1 cursor-pointer rounded-lg border-none bg-gray-900 px-1.5 py-[9px] text-[13px] font-semibold text-white disabled:cursor-wait disabled:opacity-50">⬇ Export</button>
        </div>
        <input id="speed" type="range" min="0.2" max="4" step="0.2" value="1" class="flex-1 accent-accent" />
        <label for="speed" class="flex items-center gap-1.5 text-xs text-gray-500">speed ×<span id="speedval">1</span></label>
        <input id="progress" type="range" min="0" max="1000" value="0" class="flex-1 accent-accent" />
        <label for="progress" class="flex items-center gap-1.5 text-xs text-gray-500">progress</label>
      </section>
      <p class="mt-3 text-[11px] leading-snug text-gray-500">Data: © Esri World Imagery · terrain © MapTiler/OpenTopography · routing © BRouter/OpenStreetMap · no key required.</p>
    </details>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
