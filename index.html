<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn a GPX track into a 3D satellite route-reveal animation. 100% in-browser, no upload." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
  <title>GPX Route Reveal</title>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <details id="panel" open>
      <summary>GPX Route Reveal</summary>
      <section>
        <h2>Route</h2>
        <select id="preset" title="Load a preset route">
          <option value="">Preset routes…</option>
          <option value="moxi">Moxi Trail (demo.gpx)</option>
          <option value="yongquan-baiyun">Yongquan Temple → Baiyun Cave (Gushan)</option>
          <option value="fudao-jinniushan">Fudao Skyline Walk → Jinniushan</option>
          <option value="fudao-full">Fudao Full Trail (11.6km, 7 waypoints)</option>
          <option value="sanfang-yantai">Three Lanes &amp; Seven Alleys → Yantai Hill</option>
          <option value="wushan-yushan">Wushan → Yushan (two pagodas)</option>
          <option value="shangxiahang-yantai">Shangxiahang → Yantai Hill</option>
        </select>
        <div id="drop">Drop .gpx here</div>
        <input id="file" type="file" accept=".gpx" hidden />
        <button id="pick" class="ghost" title="Click the origin, then the destination, on the map">Pick origin &amp; destination</button>
        <div id="meta" hidden></div>
      </section>
      <section id="controls" hidden>
        <h2>Playback</h2>
        <div class="row">
          <button id="play" title="Play">▶ Play</button>
          <button id="pause" title="Pause">⏸ Pause</button>
          <button id="loop" class="ghost" title="Loop playback" aria-pressed="false">↻ Loop</button>
          <button id="export" title="Record animation to WebM">⬇ Export</button>
        </div>
        <input id="speed" type="range" min="0.2" max="4" step="0.2" value="1" />
        <label for="speed">speed ×<span id="speedval">1</span></label>
        <input id="progress" type="range" min="0" max="1000" value="0" />
        <label for="progress">progress</label>
      </section>
      <p class="hint">Data: © Esri World Imagery · terrain © MapTiler/OpenTopography · routing © BRouter/OpenStreetMap · no key required.</p>
    </details>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
